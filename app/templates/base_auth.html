<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Nutrition Analyzer{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2316a34a'/><text x='16' y='23' font-family='sans-serif' font-size='18' font-weight='bold' text-anchor='middle' fill='%23fff'>A</text></svg>">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/api.js"></script>
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-brand { display: flex; align-items: center; gap: .6rem; justify-content: center; margin-bottom: 1rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-logo" aria-hidden="true">A</span>
        <span class="brand-text"><strong>AI Nutrition Analyzer</strong>
          <small class="muted">Nhận diện thực phẩm · dự đoán calo · phân tích dinh dưỡng</small></span>
      </div>
      <div class="card" style="padding:1.25rem">
        <h1 class="page-title" style="margin-bottom:.35rem">{% block heading %}{% endblock %}</h1>
        <p class="card-sub">{% block subheading %}{% endblock %}</p>
        <div id="flash" class="flash-region" role="status" aria-live="polite"></div>
        {% block content %}{% endblock %}
      </div>
      <p class="small muted" style="text-align:center;margin-top:.9rem">
        {% block footer_link %}{% endblock %}
      </p>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
