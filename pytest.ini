[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: kiểm thử chậm (huấn luyện mô hình)
    ml: kiểm thử liên quan Machine Learning
    integration: kiểm thử tích hợp (database thật, HTTP)
